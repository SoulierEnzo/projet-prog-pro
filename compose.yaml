services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: "0.0.0.0"
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-5m}"
      OLLAMA_NUM_PARALLEL: "${OLLAMA_NUM_PARALLEL:-2}"
      OLLAMA_MAX_LOADED_MODELS: "${OLLAMA_MAX_LOADED_MODELS:-2}"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "sh", "-lc", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    network_mode: "service:ollama"
    volumes:
      - ollama:/root/.ollama
    entrypoint: [ "/bin/sh","-lc" ]
    command: |
      set -e
      echo "==> Téléchargement des modèles : $${OLLAMA_MODELS}"
      echo "$${OLLAMA_MODELS}" | tr ',' '\n' | while read -r m; do
        if [ -n "$$m" ]; then
          echo "--> ollama pull $$m"
          ollama pull "$$m"
        fi
      done
      echo "==> Modèles téléchargés."
    environment:
      OLLAMA_HOST: "127.0.0.1:11434"
      OLLAMA_MODELS: "${OLLAMA_MODELS:-llama3.1:8b,mistral:7b-instruct}"
    restart: "no"

volumes:
  ollama:
