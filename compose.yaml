version: "3.8"

services:
  ollama:
    image: ollama/ollama:0.12.6
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama-init:
    image: ollama/ollama:0.12.6
    container_name: ollama-init
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint:
      - bash
      - -lc
      - |
        until ollama list >/dev/null 2>&1; do
          echo "En attente d'Ollama..."
          sleep 2
        done
        for i in {1..5}; do
          ollama pull llama3.1:8b && break
          echo "Retry $$i/5 dans 5s..."
          sleep 5
        done
        echo "Modèle llama prêt."
        for i in {1..5}; do
          ollama pull qwen3:8b && break
          echo "Retry $$i/5 dans 5s..."
          sleep 5
        done
        echo "Modèle qwen prêt."
    restart: "no"

volumes:
  ollama:
